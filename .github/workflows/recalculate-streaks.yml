# recalculate-streaks.yml
#
# Recomputes writer streaks for every author with a published article.
# Runs daily at 02:00 UTC. Also supports manual dispatch from the Actions tab.
#
# REQUIRED GitHub Actions secret (Settings > Secrets and variables > Actions):
#   CRON_SECRET: long random string matching the Vercel CRON_SECRET env var
#
# REQUIRED Vercel environment variable:
#   CRON_SECRET: exact same value as the GitHub Actions secret above

name: Recalculate Writer Streaks

on:
  # GitHub Actions cron runs in UTC.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  recalculate:
    name: Recalculate streaks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call /api/cron/recalculate-streaks
        id: call
        run: |
          # Canonical host (www): the apex 307-redirects to www, curl does not follow
          # it (no -L), the POST returns 307, and the != 200 check fails. Hit www directly.
          HTTP_STATUS=$(curl --silent --output /tmp/response_body.txt --write-out "%{http_code}" \
            --max-time 60 \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --header "Content-Type: application/json" \
            "https://www.theconsilium.co.uk/api/cron/recalculate-streaks")

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "ERROR: Endpoint returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Echo response
        if: always()
        run: cat /tmp/response_body.txt

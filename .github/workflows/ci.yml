name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Static checks and service-free unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5433/consilium
      DATABASE_URL: postgresql://postgres@localhost:5433/consilium
      DIRECT_URL: postgresql://postgres@localhost:5433/consilium
      TEST_HARNESS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate Next route types without services
        run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      # The config guards the unused test URL; these tests open no DB/HTTP connections.
      - run: npm run test:unit

  services:
    name: ${{ matrix.suite }} against isolated local services
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, browser]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consilium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d consilium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consilium
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consilium
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/consilium
      TEST_HARNESS: "1"
      USE_EXISTING_DB: "1"
      PGPORT: "5432"
      PLATFORM_TEST_PORT: "3220"
      PLATFORM_TEST_STORAGE_PORT: "55620"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install Chromium
        if: matrix.suite == 'browser'
        run: npx playwright install --with-deps chromium
      # Shared runner: guarded setup + seeds + additive DDL + Storage bucket schema,
      # production build, Storage/app startup, bounded readiness, then suite.
      # platform-check supplies identical synthetic config at build/runtime/test,
      # BASE_URL/E2E_BASE_URL and team-profile opt-in. No secrets or remote providers.
      - name: Run guarded suite
        run: npx ts-node -P tsconfig.seed.json scripts/platform-check.ts npx ts-node -P tsconfig.seed.json scripts/run-platform-suite.ts ${{ matrix.suite }}
      - name: Upload browser failure evidence
        if: ${{ !cancelled() && matrix.suite == 'browser' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

# ci.yml
#
# Pre-merge quality gate. This exists because a prior outage shipped when a new
# dependency (isomorphic-dompurify) was added to package.json but never installed,
# so it was missing from package-lock.json and node_modules — and article pages
# crashed in production. `npm ci` fails hard when package.json and the lockfile are
# out of sync, so this workflow would have caught that exact bug before merge.
#
# Runs on every PR and on pushes to main. No production secrets or services.
# The verify job uses no database; the E2E job owns a local Postgres service.
# The build step uses throwaway env values purely to satisfy
# module-load guards (e.g. NEXTAUTH_SECRET) and inlined NEXT_PUBLIC_* vars; all
# public pages are dynamic / force-dynamic, so the build never connects to a DB.

name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job only reads the repo (install/typecheck/test/build) and never
          # pushes, so don't leave the GITHUB_TOKEN in .git/config after checkout.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs strictly from package-lock.json and ERRORS if it is out
      # of sync with package.json — this is the line that guards the original bug.
      # postinstall (prisma generate) runs here automatically.
      - name: Install dependencies
        run: npm ci

      - name: Generate Next route types without services
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # Faithful production build. Catches missing imports, type errors, and
      # page-data collection failures. Dummy env values only — never real secrets.
      - name: Production build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci_dummy_secret_not_used_at_runtime
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_dummy_anon_key

      # `next build` succeeds even when sharp's libvips is missing from the
      # /api/upload function trace (it only fails at runtime on Vercel). CI runs
      # on linux-x64, the same platform as the deployed function.
      - name: Verify sharp native library is traced into /api/upload
        run: node scripts/verify-sharp-trace.mjs

      # Loads sharp from ONLY the files traced for /api/upload, copied into an empty
      # directory outside the repo, and decodes a real JPEG. A control run without
      # libvips must fail. Refuses to run unless this is linux/x64 (Vercel's target).
      - name: Run sharp from the isolated /api/upload package (linux-x64)
        run: REQUIRE_LINUX_X64=1 node scripts/verify-sharp-runtime.mjs

  # End-to-end gate: seeds a real Postgres, builds, and runs the Playwright suite.
  # A failing e2e test, a console error on any page, or any internal URL returning
  # >= 400 (including ?_rsc= prefetch requests) fails this job and blocks merge.
  e2e:
    name: E2E (Playwright), data-layer & network checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consilium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # TEST_DATABASE_URL is the single source of truth for tests: the tooling ignores
      # DATABASE_URL/DIRECT_URL and overwrites them with it. localhost passes the guard
      # (scripts/lib/assertSafeTestDatabaseHost.ts); a non-local CI database needs
      # TEST_DB_ALLOW_HOST set to its exact host.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consilium
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consilium
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/consilium
      NEXTAUTH_SECRET: ci_dummy_secret_not_used_at_runtime
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_dummy_anon_key
      SUPABASE_ANON_KEY: ci_dummy_anon_key
      SUPABASE_SERVICE_ROLE_KEY: ci_dummy_service_key
      # No RESEND_API_KEY on purpose: this job must never be able to send real email.
      CRON_SECRET: ci_cron_secret
      ADMIN_EMAILS: admin@theconsilium.com
      USE_EXISTING_DB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Chromium and WebKit: the browser workflow suites run on both (plus phone
      # emulations of each). WebKit needs its system libraries, hence --with-deps.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # scripts/run-e2e.sh is the only supported entry point. It builds the app itself
      # into .next-e2e with storage, email and OAuth pinned to local stand-ins (a local
      # Supabase-Storage-compatible server, captured email, no Google), so nothing in this
      # job can reach a real service even if a secret were present. The Playwright config
      # refuses to start without that isolation. Phases: main, workflow (browser
      # workflow suites), team-profile.
      - name: Public pages, network crawl and mobile browser workflows
        run: RUN_VITEST=1 npm run test:e2e -- --project=public --project=public-webkit --project=wf-mobile-chromium --project=wf-mobile-webkit --workers=1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            !test-results/**/outbox.jsonl
          retention-days: 7

  # Separate status for the changed role/profile suites; all prior projects remain
  # enabled in the two browser jobs. Each runner owns its DB, storage and mail.
  role-workflows:
    name: Critical roles, profiles and testing mode
    runs-on: ubuntu-latest
    # The serialized Chromium/WebKit census itself completes in about 46m on
    # GitHub. Dependency install, the isolated production build and upload of
    # the requested passing simulator traces pushed the measured job just past
    # 60m even though all 593 cases had passed. Leave headroom for cleanup and
    # evidence upload; individual action/navigation limits and retries stay put.
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consilium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # TEST_DATABASE_URL is the single source of truth for tests: the tooling ignores
      # DATABASE_URL/DIRECT_URL and overwrites them with it. localhost passes the guard
      # (scripts/lib/assertSafeTestDatabaseHost.ts); a non-local CI database needs
      # TEST_DB_ALLOW_HOST set to its exact host.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consilium
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consilium
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/consilium
      NEXTAUTH_SECRET: ci_dummy_secret_not_used_at_runtime
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_dummy_anon_key
      SUPABASE_ANON_KEY: ci_dummy_anon_key
      SUPABASE_SERVICE_ROLE_KEY: ci_dummy_service_key
      # No RESEND_API_KEY on purpose: this job must never be able to send real email.
      CRON_SECRET: ci_cron_secret
      ADMIN_EMAILS: admin@theconsilium.com
      USE_EXISTING_DB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium and WebKit: the browser workflow suites run on both (plus phone
      # emulations of each). WebKit needs its system libraries, hence --with-deps.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # scripts/run-e2e.sh is the only supported entry point. It builds the app itself
      # into .next-e2e with storage, email and OAuth pinned to local stand-ins (a local
      # Supabase-Storage-compatible server, captured email, no Google), so nothing in this
      # job can reach a real service even if a secret were present. The Playwright config
      # refuses to start without that isolation. Phases: main, workflow (browser
      # workflow suites), team-profile.
      - name: Ordinary and simulated workflows, ownership, review scope, publication and profiles
        run: npm run test:e2e -- --project=editorial --project=editor --project=lifecycle --project=wf-chromium --project=wf-webkit --project=simulator-chromium --project=testing-mode --project=team-profile --workers=1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: critical-role-playwright-report
          path: |
            playwright-report/
            test-results/
            !test-results/**/outbox.jsonl
          retention-days: 7

  # Platform upgrade journeys (tests/e2e/upgrade-*.spec.ts): discovery and topics, rich
  # content, stale-revision protection, consented reading analytics, and the final
  # integration journey. A separate status, with its own DB, storage and mail, so its
  # serial run never lengthens the roles job and never overlaps the public count checks.
  upgrade-journeys:
    name: Platform upgrade journeys
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consilium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Same isolation rules as the other E2E jobs: TEST_DATABASE_URL is the only database
      # tests may use, and scripts/run-e2e.sh pins storage, email and OAuth to local stand-ins.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consilium
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consilium
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/consilium
      NEXTAUTH_SECRET: ci_dummy_secret_not_used_at_runtime
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_dummy_anon_key
      SUPABASE_ANON_KEY: ci_dummy_anon_key
      SUPABASE_SERVICE_ROLE_KEY: ci_dummy_service_key
      # No RESEND_API_KEY on purpose: this job must never be able to send real email.
      CRON_SECRET: ci_cron_secret
      ADMIN_EMAILS: admin@theconsilium.com
      USE_EXISTING_DB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Discovery, rich content, revisions, growth analytics and final integration
        run: npm run test:e2e -- --project=upgrade --workers=1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-journeys-playwright-report
          path: |
            playwright-report/
            test-results/
            !test-results/**/outbox.jsonl
          retention-days: 7
